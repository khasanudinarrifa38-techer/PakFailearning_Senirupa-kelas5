    /* Papan Skor 6 Pemain */
    .scoreboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; }

    .score-card .p-score { font-size: 16px; color: #4ade80; font-weight: bold; }

    .role-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { background: #64748b; cursor: not-allowed; opacity: 0.6; }
    
    .btn-p1 { background: #ef4444; }
    .btn-p2 { background: #3b82f6; }
    .btn-p3 { background: #22c55e; }
    .btn-p4 { background: #eab308; color: #000; }
    .btn-p5 { background: #a855f7; }
    .btn-p6 { background: #ec4899; }

    #maze-canvas { background: #000; border: 4px solid #38bdf8; border-radius: 8px; margin-top: 10px; max-width: 100%; }
    
    /* Modal Soal Kuis */

    .opt-btn { display: block; width: 100%; padding: 10px; margin: 8px 0; background: #475569; color: white; border: none; border-radius: 5px; cursor: pointer; text-align: left; }
    .opt-btn:hover { background: #64748b; }
    .notice { font-size: 14px; color: #f87171; margin-top: 10px; }

    // Fungsi Pengacak Array (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // Membagi 20 Soal Berbeda untuk Masing-masing dari 6 Pemain
    const playerQuestionBanks = {};
    Object.keys(playerConfigs).forEach((pKey) => {
      // Mengacak seluruh bank soal lalu mengambil 20 soal pertama
      playerQuestionBanks[pKey] = shuffleArray(masterQuizDatabase).slice(0, 20);
    });

    let currentRole = '';
    let players = {
      Player1: { ...START_POS },
      Player2: { ...START_POS },
      Player3: { ...START_POS },
      Player4: { ...START_POS },
      Player5: { ...START_POS },
      Player6: { ...START_POS }
    };
    let playerScores = { Player1: 0, Player2: 0, Player3: 0, Player4: 0, Player5: 0, Player6: 0 };
    let playerFinished = { Player1: false, Player2: false, Player3: false, Player4: false, Player5: false, Player6: false };

    // Pantau Status Peran
    db.ref('game/roles').on('value', (snapshot) => {
      const rolesState = snapshot.val() || {};
      let takenCount = 0;

      Object.keys(playerConfigs).forEach((pKey) => {
        const btn = document.getElementById(`btn-${pKey}`);
        const stBadge = document.getElementById(`st-${pKey}`);
        
        if (rolesState[pKey]) {
          takenCount++;
          btn.disabled = true;
          btn.innerText = `${playerConfigs[pKey].name} (Terisi)`;
          stBadge.innerText = 'Online';
          stBadge.style.background = '#22c55e';
        } else {
          btn.disabled = false;
          btn.innerText = `${playerConfigs[pKey].name} (${pKey === 'Player1' ? 'Merah' : pKey === 'Player2' ? 'Biru' : pKey === 'Player3' ? 'Hijau' : pKey === 'Player4' ? 'Kuning' : pKey === 'Player5' ? 'Ungu' : 'Pink'})`;
          stBadge.innerText = 'Kosong';
          stBadge.style.background = '#475569';
        }
      });

      const notice = document.getElementById('role-notice');
      if (takenCount === 6) {
        notice.innerText = "Semua slot pemain penuh (6/6). Anda dapat bergabung sebagai Penonton.";
      } else {
        notice.innerText = "";
      }
    });

    // Pantau Skor Masing-masing Pemain
    db.ref('game/scores').on('value', (snapshot) => {
      const scores = snapshot.val() || {};
      Object.keys(playerConfigs).forEach((pKey) => {
        playerScores[pKey] = scores[pKey] || 0;
        const scoreElem = document.getElementById(`sc-${pKey}`);
        if (scoreElem) scoreElem.innerText = playerScores[pKey];
      });
    });

    // Pantau Posisi Pemain
    db.ref('game/players').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        Object.keys(playerConfigs).forEach((pKey) => {
          if (data[pKey]) players[pKey] = data[pKey];
        });
        renderCanvas();
      }
    });

    // Pantau Status Selesai
    db.ref('game/finished').on('value', (snapshot) => {
      const finishedData = snapshot.val() || {};
      playerFinished = finishedData;
    });

    // Mengambil Slot Pemain
    function claimRole(role) {
      const roleRef = db.ref(`game/roles/${role}`);

      roleRef.transaction((currentVal) => {
        if (currentVal === null) return myClientId;
        return;
      }, (error, committed) => {
        if (committed) {
          currentRole = role;
          roleRef.onDisconnect().remove();
          
          document.getElementById('user-role').innerText = `${playerConfigs[role].name}`;
          document.getElementById('user-role').style.color = playerConfigs[role].color;
          document.getElementById('role-box').style.display = 'none';
          
          db.ref(`game/players/${currentRole}`).set(START_POS);
          initGame();
        } else {
          alert('Slot ini baru saja diambil pemain lain!');
        }
      });
    }

    // Masuk Sebagai Penonton
    function joinAsSpectator() {
      currentRole = 'Spectator';
      document.getElementById('user-role').innerText = 'Penonton (Spectator)';
      document.getElementById('role-box').style.display = 'none';
      initGame();
    }

    function initGame() {
      if (currentRole.startsWith('Player')) {
        window.addEventListener('keydown', (e) => {
          if (playerFinished[currentRole]) return;

          let pos = players[currentRole];
          let nextX = pos.x;
          let nextY = pos.y;

          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') nextY--;
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') nextY++;
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') nextX--;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') nextX++;

          if (nextY >= 0 && nextY < 20 && nextX >= 0 && nextX < 20) {
            if (mazeGrid[nextY][nextX] === 0) {
              pos.x = nextX;
              pos.y = nextY;
              db.ref(`game/players/${currentRole}`).set(pos);

              // Cek Kemenangan Individu
              if (pos.x === FINISH_POS.x && pos.y === FINISH_POS.y) {
                db.ref(`game/finished/${currentRole}`).set(true);
                const bonus = 500;
                const newScore = (playerScores[currentRole] || 0) + bonus;
                db.ref(`game/scores/${currentRole}`).set(newScore);
                alert(`SELAMAT! ${playerConfigs[currentRole].name} berhasil mencapai FINISH! (+500 Poin)`);
                return;
              }

              // Kesempatan Kuis
              if (Math.random() < 0.05) {
                triggerQuiz();
              }
            }
          }
        });
      }

      renderCanvas();
    }

    function renderCanvas() {
      const canvas = document.getElementById('maze-canvas');
      const ctx = canvas.getContext('2d');
      const cellSize = 25;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gambar Dinding & Jalur
      for (let r = 0; r < 20; r++) {
        for (let c = 0; c < 20; c++) {
          if (mazeGrid[r][c] === 1) {
            ctx.fillStyle = '#334155';
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
            ctx.strokeStyle = '#1e293b';
            ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
          } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          }
        }
      }

      // Gambar Area START (Hijau)
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(START_POS.x * cellSize, START_POS.y * cellSize, cellSize, cellSize);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('START', START_POS.x * cellSize + 1, START_POS.y * cellSize + 16);

      // Gambar Area FINISH (Emas/Kuning)
      ctx.fillStyle = '#eab308';
      ctx.fillRect(FINISH_POS.x * cellSize, FINISH_POS.y * cellSize, cellSize, cellSize);
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 8px sans-serif';
      ctx.fillText('FINISH', FINISH_POS.x * cellSize + 1, FINISH_POS.y * cellSize + 16);

      // Render 6 Pemain
      Object.keys(playerConfigs).forEach((pKey) => {
        const conf = playerConfigs[pKey];
        const pPos = players[pKey];

        if (pPos) {
          ctx.fillStyle = conf.color;
          ctx.beginPath();
          ctx.arc(
            pPos.x * cellSize + conf.offsetX,
            pPos.y * cellSize + conf.offsetY,
            4, // Ukuran lingkaran disesuaikan
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      });
    }

    // Logika Kuis Khusus Pemain
    function triggerQuiz() {
      const myBank = playerQuestionBanks[currentRole];
      if (!myBank || myBank.length === 0) return;

      const randomIdx = Math.floor(Math.random() * myBank.length);
      const q = myBank[randomIdx];
      
      document.getElementById('question-text').innerText = q.q;
      const opts = document.getElementById('options-container');
      opts.innerHTML = '';

      q.o.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => submitAnswer(idx, q.a);
        opts.appendChild(btn);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function submitAnswer(selected, correct) {
      let currentScore = playerScores[currentRole] || 0;

      if (selected === correct) {
        currentScore += 100;
        alert("Jawaban Benar! (+100 Poin untuk Anda)");
      } else {
        currentScore -= 25;
        alert("Jawaban Salah! (-25 Poin)");
      }
      
      db.ref(`game/scores/${currentRole}`).set(currentScore);
      document.getElementById('quiz-modal').style.display = 'none';
    }
  </script>
</body>
</html>
